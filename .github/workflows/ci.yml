name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang clang-tools-extra make \
            sqlite-devel openssl-devel gtest-devel gmock-devel \
            ca-certificates curl tar git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed source files
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --system --add safe.directory '*' || true
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1

            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}"...HEAD -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" "${{ github.sha }}" -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true


      - name: Bootstrap slim cppup
        run: ./bootstrap.sh

      - name: Build full cppup
        run: ./bootstrap_build/cppup_bootstrap build

      - name: Format code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup format "${files[@]}" --check
          else
            echo "No matching files changed"
          fi


      - name: Lint code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup tidy "${files[@]}"
          else
            echo "No matching files changed"
          fi
      - name: Run tests with coverage
        run: ./build/cppup test --coverage

  windows-bootstrap:
    # Smoke test for the Windows bootstrap path: build the slim
    # cppup_bootstrap.exe via bootstrap.sh under MSYS2's MinGW64 shell
    # and verify --help runs. The POSIX call sites (fork/exec, dlopen,
    # isatty, chmod, setenv, etc.) all have #ifdef _WIN32 branches now,
    # so this is a hard gate.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl

      - name: Show compiler version
        run: g++ --version

      - name: Bootstrap slim cppup (via shared manifest)
        run: ./bootstrap.sh

      - name: Smoke-test slim binary
        run: ./bootstrap_build/cppup_bootstrap.exe --help

  windows-bat:
    # Same goal but exercises bootstrap.bat from native cmd.exe — proves the
    # batch script parses scripts/bootstrap_sources.txt and drives MinGW
    # correctly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 / MinGW64 (provides g++, ar, bash on PATH)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl

      - name: Verify toolchain visible from cmd.exe
        shell: cmd
        run: |
          where g++
          where ar
          where bash

      - name: Run bootstrap.bat
        shell: cmd
        run: bootstrap.bat

      - name: Smoke-test slim binary
        shell: cmd
        run: bootstrap_build\cppup_bootstrap.exe --help
