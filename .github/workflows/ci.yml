name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang clang-tools-extra make \
            sqlite-devel openssl-devel gtest-devel gmock-devel \
            ca-certificates curl tar git

      - uses: actions/checkout@v4

      - name: Collect changed source files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1

            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}"...HEAD -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" "${{ github.sha }}" -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true


      - name: Bootstrap slim cppup
        run: ./bootstrap.sh

      - name: Build full cppup
        run: ./bootstrap_build/cppup_bootstrap build

      - name: Format code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup format "${files[@]}" --check
          else
            echo "No matching files changed"
          fi


      - name: Lint code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup tidy "${files[@]}"
          else
            echo "No matching files changed"
          fi
      - name: Run tests with coverage
        run: ./build/cppup test --coverage
