name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang clang-tools-extra make \
            sqlite-devel openssl-devel gtest-devel gmock-devel \
            ca-certificates curl tar git

      - uses: actions/checkout@v4

      - name: Bootstrap slim cppup
        run: ./bootstrap.sh

      - name: Build full cppup
        run: ./bootstrap_build/cppup_bootstrap build

      - name: Run tests
        run: ./build/cppup test
