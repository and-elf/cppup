name: ci-cpp

# Run on every change that can affect the C++ build/test/format/tidy result.
# Python-only changes under manifests/tools/conan2toml/ are handled by
# ci-python.yml and do not need to retrigger this workflow.
on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'templates/**'
      - 'scripts/**'
      - 'examples/**'
      - 'manifests/recipes/**'
      - 'manifests/examples/**'
      - 'manifests/index.yaml'
      - 'bootstrap.sh'
      - 'bootstrap.bat'
      - 'build.cpp'
      - 'cppup_bootstrap.cpp'
      - 'cppup.lock'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/ci-cpp.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'templates/**'
      - 'scripts/**'
      - 'examples/**'
      - 'manifests/recipes/**'
      - 'manifests/examples/**'
      - 'manifests/index.yaml'
      - 'bootstrap.sh'
      - 'bootstrap.bat'
      - 'build.cpp'
      - 'cppup_bootstrap.cpp'
      - 'cppup.lock'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/ci-cpp.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Install build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ clang clang-tools-extra make \
            sqlite-devel openssl-devel gtest-devel gmock-devel \
            ca-certificates curl tar git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed source files
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --system --add safe.directory '*' || true
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1

            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}"...HEAD -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" "${{ github.sha }}" -- \
              '*.cpp' '*.cxx' '*.cc' '*.c' \
              '*.hpp' '*.hxx' '*.h' \
              > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true


      - name: Bootstrap slim cppup
        run: ./bootstrap.sh

      - name: Sync sources
        run: ./bootstrap_build/cppup_bootstrap sync

      - name: Build full cppup
        run: ./bootstrap_build/cppup_bootstrap build

      - name: Format code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup format "${files[@]}" --check
          else
            echo "No matching files changed"
          fi


      - name: Lint code
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < changed_files.txt

          if ((${#files[@]})); then
            ./build/cppup tidy "${files[@]}"
          else
            echo "No matching files changed"
          fi
      - name: Run tests with coverage
        # Gate merges on a minimum total line-coverage percentage. The floor
        # is set below the current level (~61%) to leave headroom for
        # environment differences; raise it as coverage improves.
        run: ./build/cppup test --coverage --fail-under 55

  windows-bootstrap:
    # Smoke test for the Windows bootstrap path: build the slim
    # cppup_bootstrap.exe via bootstrap.sh under MSYS2's MinGW64 shell
    # and verify --help runs. The POSIX call sites (fork/exec, dlopen,
    # isatty, chmod, setenv, etc.) all have #ifdef _WIN32 branches now,
    # so this is a hard gate.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl

      - name: Show compiler version
        run: g++ --version

      - name: Bootstrap slim cppup (via shared manifest)
        run: ./bootstrap.sh

      - name: Smoke-test slim binary
        run: ./bootstrap_build/cppup_bootstrap.exe --help

  windows-bat:
    # Same goal but exercises bootstrap.bat from native cmd.exe — proves the
    # batch script parses scripts/bootstrap_sources.txt and drives MinGW
    # correctly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 / MinGW64 (provides g++, ar, bash on PATH)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl

      - name: Make MSYS2 MinGW64 win the toolchain lookup in cmd.exe
        # windows-latest ships a standalone C:\mingw64 from a chocolatey
        # package that's higher up the inherited PATH than setup-msys2's
        # mingw64 bin. That g++ knows nothing about MSYS2's sqlite3/openssl
        # install trees, so the slim bootstrap fails with
        # `fatal error: sqlite3.h: No such file or directory`. Prepend
        # MSYS2's bin so its toolchain (and its include/lib search paths)
        # wins where it matters. setup-msys2 extracts MSYS2 to a
        # runner-specific path (often inside the workspace, NOT C:\msys64),
        # so resolve it from the action's `msys2-location` output rather
        # than hardcoding a path.
        shell: cmd
        run: echo ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin>>%GITHUB_PATH%

      - name: Verify toolchain visible from cmd.exe
        shell: cmd
        run: |
          where g++
          where ar
          where bash

      - name: Run bootstrap.bat
        shell: cmd
        run: bootstrap.bat

      - name: Smoke-test slim binary
        shell: cmd
        run: bootstrap_build\cppup_bootstrap.exe --help
