image: fedora:43

stages:
  - build
  - test
  - lint

before_script:
  - dnf install -y --setopt=install_weak_deps=False
      gcc gcc-c++ clang clang-tools-extra
      sqlite-devel openssl-devel gtest-devel gmock-devel
      ca-certificates git which findutils
  - command -v cppup >/dev/null || (echo "cppup not installed in image" && exit 1)

build:
  stage: build
  script:
    - cppup sync
    - cppup build
  artifacts:
    paths:
      - build/
    expire_in: 1 day

test:
  stage: test
  needs: ["build"]
  script:
    - cppup test

format:
  stage: lint
  script:
    - cppup format --check

tidy:
  stage: lint
  needs: ["build"]
  script:
    - cppup tidy
  allow_failure: true
