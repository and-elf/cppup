image: debian:trixie-slim

stages:
  - build
  - test
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cppup"

before_script:
  - apt-get update -qq
  - apt-get install -y --no-install-recommends
      build-essential g++ clang
      libsqlite3-dev libssl-dev libgtest-dev libgmock-dev
      ca-certificates curl tar

build:
  stage: build
  script:
    - ./bootstrap.sh build
  artifacts:
    paths:
      - build/cppup
      - bootstrap_build/cppup
    expire_in: 1 day

test:
  stage: test
  needs: ["build"]
  script:
    - ./build/cppup test

release:
  stage: release
  needs: ["build", "test"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - test -f build/cppup
    - sha256sum build/cppup | awk '{print $1}' > build/cppup.sha256
    - cat build/cppup.sha256
    - curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
        --upload-file build/cppup
        "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/cppup-linux-x86_64"
    - curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
        --upload-file build/cppup.sha256
        "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/cppup-linux-x86_64.sha256"
  artifacts:
    paths:
      - build/cppup
      - build/cppup.sha256
