# Tool package: a buildable executable installed into the cppup tool
# cache. Builds from source via CMake; exports one binary.
schema = 1

[package]
name         = "ninja"
version      = "1.11.1"
kind         = "tool"
description  = "Small build system focused on speed"
license      = "Apache-2.0"
homepage     = "https://ninja-build.org"
repository   = "https://github.com/ninja-build/ninja"
cppup_compat = ">=0.5.0"

[source]
type = "git"
url  = "https://github.com/ninja-build/ninja.git"
tag  = "v1.11.1"

[build]
system = "cmake"
args   = ["-DBUILD_TESTING=OFF"]

[[exports]]
type       = "binary"
name       = "ninja"
install_as = "ninja"

[platforms]
os   = ["linux", "macos", "windows"]
arch = ["x86_64", "arm64"]
