# Plugin package: a cppup build-system plugin. Mirrors the
# core/plugin/manifest.hpp shape. Plugins are built from source and
# loaded as shared libraries (or statically linked, see static_registry).
schema = 1

[package]
name         = "ninja-builder"
version      = "0.1.0"
kind         = "plugin"
description  = "Ninja build-system plugin for cppup"
license      = "MIT"
cppup_compat = ">=0.5.0"

[source]
type = "directory"           # in-tree plugin during development
url  = "./plugins/ninja-builder"

[build]
system = "cmake"

[plugin]
build_hash  = ""             # filled by build pipeline
commit_hash = ""

[[plugin.entries]]
id             = "ninja"
kind           = "build_system"
vtable_version = 1
description    = "Drives ninja build files"

[plugin.dependencies]
system  = ["ninja"]
plugins = []

[platforms]
os   = ["linux", "macos", "windows"]
arch = ["x86_64", "arm64"]
