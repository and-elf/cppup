# Toolchain package: declares an already-installed compiler that the
# registry promises is on PATH. A from-source GCC build would additionally
# fill in [source] + [build].
schema = 1

[package]
name         = "gcc-13"
version      = "13.2.0"
kind         = "toolchain"
description  = "GCC 13 (g++/gcc) — system-provided"
license      = "GPL-3.0-with-GCC-exception"
cppup_compat = ">=0.5.0"

[toolchain]
cxx          = "g++-13"
cc           = "gcc-13"
cxx_standard = "c++20"
warnings     = "strict"
extra_flags  = []

[platforms]
os   = ["linux"]
arch = ["x86_64", "arm64"]
